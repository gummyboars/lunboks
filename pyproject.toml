[project]
name = "lunboks"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["websockets>=10"]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pylint>=3.3",
]

[tool.ruff]
indent-width = 2
line-length = 100

[tool.ruff.format]
indent-style = "space"
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "I001",  # import order - TODO: turn on again
  "PT",  # pytest is a plague upon the entire python ecosystem
  "CPY001",  # copyright notice
  "ANN",  # annotations
  "T20",  # print/pprint
  "TD",  # todos
  "EM",  # errmsg
  "FA",  # future annotations
  "FBT",  # boolean trap
  "C90",  # mccabe complexity
  "C420",  # use dict.fromkeys
  "ARG",  # unused argument - checked by pylint
  "PTH",  # pathlib - TODO: turn on again
  "F403",  # undefined names
  "F405",  # undefined local with import star
  "PLC0414",  # useless import alias
  "PLR2004",  # magic value comparison
  "PLR0911",  # too many return statements
  "PLR0912",  # too many branches
  "PLR0913",  # too many arguments
  "PLR0915",  # too many statements
  "PLR0917",  # too many positional arguments
  "PLR5501",  # collapsible else if
  "N802",  # invalid function name - checked by pylint
  "N806",  # non lowercase variable in function - checked by pylint
  "D100",  # undocumented public module
  "D101",  # undocumented public class
  "D102",  # undocumented public method
  "D103",  # undocumented public function
  "D104",  # undocumented public package
  "D105",  # undocumented magic method
  "D107",  # undocumented public init
  "D401",  # non imperative mood
  "D203",  # one-blank-line-before-class
  "D213",  # multi-line-summary-second-line
  "FIX002",  # line-contains-todo
  "FIX004",  # line-contains-hack
  "COM812",  # missing-trailing-comma
  "S101",  # assert
  "S311",  # suspicious-non-cryptographic-number-usage
  "FLY002",  # static-join-to-f-string  TODO: turn on again
  "TRY003",  # raise-vanilla-args
  "TRY300",  # try-consider-else
  "ERA001",  # commented-out-code
  "B904",  # raise-without-from-inside-except
  "SLF001",  # private-member-access
  "RUF005",  # collection-literal-concatenation
  "RUF017",  # quadratic-list-summation
  "RUF022",  # unsorted-dunder-all
  "SIM102",  # collapsible-if
  "SIM117",  # multiple-with-statements
  "PYI024",  # collections-named-tuple  TODO: turn on again
  "PYI041",  # redundant-numeric-union
  "UP007",   # Union[X,Y] instead of X|Y
  "UP045",   # Optional[X] instead of X|None
]

[tool.pylint.main]
jobs = 0

[tool.pylint.basic]
function-rgx = "(([a-z_]+)|(([A-Z][a-z]*)+))"
method-rgx = "(([a-z_]+)|(test([A-Z][a-z0-9]*)+))"
good-names = ["i", "x", "y"]

[tool.pylint.format]
indent-after-paren = 4
indent-string = "  "
max-line-length = 100

[tool.pylint.string]
check-quote-consistency = true

[tool.pylint.variables]
ignored-argument-names = "^char$|^_.*|^unused_"

[tool.pylint.miscellaneous]
notes = ["FIXME", "XXX"]

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-many-locals",
    "too-many-instance-attributes",
    "too-many-arguments",
    "too-many-statements",
    "too-many-branches",
    "too-many-return-statements",
    "too-many-lines",
    "too-many-positional-arguments",
    "too-few-public-methods",
    "too-many-public-methods",
    "use-sequence-for-iteration",
    "raise-missing-from",
    "similarities",
    "unused-wildcard-import",
    "wildcard-import",
    "wrong-import-position",
    "line-too-long",
    "cyclic-import",
]

[tool.pylint.reports]
score = false
